<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BI Grupo Nobre</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--vermelho:#C8102E;--bordo:#5C1414;--grafite:#2D2D2D;--cinza:#EDE9E5;--bg:#faf8f6;--fg:#2D2D2D;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1414;--fg:#f3eeea;--card:#241a1a;--cinza:#3a2c2c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Poppins,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-left,0px)) 48px}
.wrap{width:100%;max-width:640px;text-align:center}
.marca{font-weight:700;letter-spacing:.5px;color:var(--vermelho);font-size:14px;text-transform:uppercase}
h1{font-weight:700;font-size:30px;margin:6px 0 4px}
.sub{color:var(--fg);opacity:.7;font-size:15px;margin:0 0 28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:460px){.grid{grid-template-columns:1fr}}
a.card{display:block;text-decoration:none;color:#fff;border-radius:16px;padding:26px 20px;background:linear-gradient(135deg,var(--vermelho),var(--bordo));box-shadow:0 8px 22px rgba(92,20,20,.25);transition:transform .12s}
a.card:active{transform:scale(.98)}
a.card .t{font-weight:700;font-size:20px}
a.card .d{font-weight:400;font-size:13px;opacity:.92;margin-top:6px;line-height:1.4}
.rod{margin-top:26px;font-size:12px;opacity:.6;line-height:1.5}
</style></head><body>
<div class="wrap">
<div class="marca">Grupo Nobre</div>
<h1>Painel de BI</h1>
<p class="sub">Dados da Instituição de Ensino, atualizados automaticamente</p>
<div class="grid">
<a class="card" href="./geral.html"><div class="t">BI Geral</div><div class="d">Vendas, marketing, site e redes sociais</div></a>
<a class="card" href="./comercial.html"><div class="t">BI Comercial</div><div class="d">Faturamento, vendedores, metas e pagamentos</div></a>
</div>
<p class="rod">Acesso interno. Atualiza sozinho a cada 2 horas.</p>
</div>
</body></html>
